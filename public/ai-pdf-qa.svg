<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="pdfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#pdfBg)"/>
  
  <rect x="30" y="25" width="1140" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="65" cy="55" r="7" fill="#ef4444"/>
  <circle cx="90" cy="55" r="7" fill="#f59e0b"/>
  <circle cx="115" cy="55" r="7" fill="#10b981"/>
  <text x="145" y="60" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="600">Ask My PDF (AI) — Document Question Answering with Groq &amp; Streamlit</text>

  <g transform="translate(60, 120)">
    <!-- Upload panel -->
    <rect x="0" y="0" width="350" height="560" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="30" y="45" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">📄 Document Ingestion</text>
    <rect x="25" y="80" width="300" height="160" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-dasharray="6 6"/>
    <text x="75" y="150" fill="#94a3b8" font-family="sans-serif" font-size="14">research_paper_ai.pdf</text>
    <text x="120" y="180" fill="#10b981" font-family="sans-serif" font-size="13">✓ Ingested (24 Pages)</text>

    <text x="30" y="285" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600">PIPELINE DETAILS</text>
    <text x="30" y="320" fill="#cbd5e1" font-family="sans-serif" font-size="14">• PyPDF parser extraction</text>
    <text x="30" y="355" fill="#cbd5e1" font-family="sans-serif" font-size="14">• Text chunking &amp; context formatting</text>
    <text x="30" y="390" fill="#cbd5e1" font-family="sans-serif" font-size="14">• High-throughput Groq LLM API</text>
    <text x="30" y="425" fill="#cbd5e1" font-family="sans-serif" font-size="14">• Streamlit interactive chat UI</text>
  </g>

  <!-- Chat conversation panel -->
  <g transform="translate(450, 120)">
    <rect x="0" y="0" width="690" height="560" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="45" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">💬 Context-Aware Q&amp;A Session</text>
    
    <!-- User message -->
    <rect x="35" y="85" width="620" height="70" rx="8" fill="#0f172a" stroke="#3b82f6"/>
    <text x="55" y="115" fill="#60a5fa" font-family="sans-serif" font-size="13" font-weight="600">USER QUESTION</text>
    <text x="55" y="140" fill="#f1f5f9" font-family="sans-serif" font-size="14">What are the primary performance improvements of the proposed architecture?</text>

    <!-- AI message -->
    <rect x="35" y="180" width="620" height="230" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="55" y="210" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="600">AI ANSWER (GROQ LLM)</text>
    <text x="55" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="14">Based on section 4.2 of the uploaded document, the system achieves:</text>
    <text x="55" y="275" fill="#f1f5f9" font-family="sans-serif" font-size="14">1. 3.4x faster inference latency by decoupling document parsing from validation.</text>
    <text x="55" y="310" fill="#f1f5f9" font-family="sans-serif" font-size="14">2. Zero data leakage of PII through local entity extraction prior to cloud queries.</text>
    <text x="55" y="345" fill="#f1f5f9" font-family="sans-serif" font-size="14">3. Linear scalability up to 10,000 document records with in-memory caching.</text>
    <text x="55" y="385" fill="#64748b" font-family="sans-serif" font-size="12">Source: Section 4.2, Pages 14-16</text>

    <!-- Input bar -->
    <rect x="35" y="450" width="620" height="60" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="55" y="485" fill="#64748b" font-family="sans-serif" font-size="14">Ask any question about this document...</text>
  </g>
</svg>