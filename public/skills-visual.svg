<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" rx="16" fill="url(#bg)"/>
  <circle cx="200" cy="220" r="140" fill="url(#glow)"/>

  <!-- Neural Net / AI Node Graph -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.6">
    <line x1="120" y1="140" x2="200" y2="100"/>
    <line x1="280" y1="140" x2="200" y2="100"/>
    <line x1="120" y1="140" x2="120" y2="240"/>
    <line x1="280" y1="140" x2="280" y2="240"/>
    <line x1="120" y1="240" x2="200" y2="300"/>
    <line x1="280" y1="240" x2="200" y2="300"/>
    <line x1="200" y1="100" x2="200" y2="200"/>
    <line x1="120" y1="140" x2="200" y2="200"/>
    <line x1="280" y1="140" x2="200" y2="200"/>
    <line x1="120" y1="240" x2="200" y2="200"/>
    <line x1="280" y1="240" x2="200" y2="200"/>
    <line x1="200" y1="200" x2="200" y2="300"/>
  </g>

  <!-- Nodes -->
  <circle cx="200" cy="100" r="10" fill="#38bdf8"/>
  <circle cx="120" cy="140" r="8" fill="#818cf8"/>
  <circle cx="280" cy="140" r="8" fill="#818cf8"/>
  <circle cx="200" cy="200" r="14" fill="#a855f7"/>
  <circle cx="120" cy="240" r="8" fill="#818cf8"/>
  <circle cx="280" cy="240" r="8" fill="#818cf8"/>
  <circle cx="200" cy="300" r="10" fill="#ec4899"/>

  <!-- Code / Terminal snippets -->
  <rect x="40" y="360" width="320" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="60" y="390" fill="#38bdf8" font-family="monospace" font-size="13">const model = new AIWorkflow();</text>
  <text x="60" y="415" fill="#a5b4fc" font-family="monospace" font-size="13">await model.analyze(data);</text>
  <text x="60" y="438" fill="#10b981" font-family="monospace" font-size="13">// Output: Actionable Insights ✓</text>
</svg>