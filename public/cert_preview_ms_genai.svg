<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="750"/>
    <line x1="600" y1="0" x2="600" y2="750"/>
    <line x1="900" y1="0" x2="900" y2="750"/>
  </g>

  <!-- Certificate Border Card -->
  <rect x="60" y="50" width="1080" height="650" rx="20" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="2"/>

  <!-- Microsoft 4-square Logo -->
  <g transform="translate(120, 110)">
    <rect x="0" y="0" width="22" height="22" fill="#f25022"/>
    <rect x="26" y="0" width="22" height="22" fill="#7fba00"/>
    <rect x="0" y="26" width="22" height="22" fill="#00a4ef"/>
    <rect x="26" y="26" width="22" height="22" fill="#ffb900"/>
    <text x="65" y="34" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">Microsoft &amp; LinkedIn</text>
  </g>

  <!-- Category Tag -->
  <rect x="880" y="110" width="200" height="42" rx="21" fill="url(#badgeGrad)"/>
  <text x="980" y="136" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1">PROFESSIONAL CERT</text>

  <!-- Title & Subtitle -->
  <text x="120" y="260" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800">Career Essentials in</text>
  <text x="120" y="325" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800">Generative AI</text>

  <text x="120" y="390" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">Validated Foundational Curriculum in LLMs, Prompt Engineering &amp; AI Ethics</text>

  <!-- Inner Pill Highlights -->
  <g transform="translate(120, 460)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="210" height="50" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="105" y="31" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">🧠 LLM Mechanics</text>

    <!-- Pill 2 -->
    <rect x="230" y="0" width="230" height="50" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="345" y="31" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">💬 Prompt Engineering</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="190" height="50" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="575" y="31" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">⚖️ AI Ethics</text>
  </g>

  <!-- Footer Verification Line -->
  <line x1="120" y1="570" x2="1080" y2="570" stroke="#334155" stroke-width="1"/>
  <text x="120" y="625" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">Credential Type: Industry Professional Pathway • Verified Coursework • Completed 2024</text>
</svg>
