<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="heartBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#181829"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#heartBg)"/>

  <rect x="30" y="25" width="1140" height="60" rx="10" fill="#1e1e38" stroke="#37375a" stroke-width="1"/>
  <circle cx="65" cy="55" r="7" fill="#ef4444"/>
  <circle cx="90" cy="55" r="7" fill="#f59e0b"/>
  <circle cx="115" cy="55" r="7" fill="#10b981"/>
  <text x="145" y="60" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="600">Heart Disease Prediction — Machine Learning Classification with KNeighborsClassifier</text>

  <!-- Left Model Stats -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="400" height="560" rx="12" fill="#1e1e38" stroke="#37375a"/>
    <text x="30" y="45" fill="#f43f5e" font-family="sans-serif" font-size="18" font-weight="700">🩺 ML Model Architecture</text>
    
    <rect x="25" y="80" width="350" height="110" rx="8" fill="#111122" stroke="#2d2d48"/>
    <text x="40" y="115" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">ALGORITHM</text>
    <text x="40" y="145" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">K-Nearest Neighbors (KNN)</text>
    <text x="40" y="170" fill="#38bdf8" font-family="sans-serif" font-size="13">Scikit-learn • Standardized Scaling</text>

    <text x="30" y="235" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600">INPUT ATTRIBUTES EVALUATED</text>
    <text x="30" y="270" fill="#cbd5e1" font-family="sans-serif" font-size="14">• Age, Sex, Chest Pain Type (cp)</text>
    <text x="30" y="305" fill="#cbd5e1" font-family="sans-serif" font-size="14">• Resting Blood Pressure (trestbps)</text>
    <text x="30" y="340" fill="#cbd5e1" font-family="sans-serif" font-size="14">• Serum Cholesterol (chol)</text>
    <text x="30" y="375" fill="#cbd5e1" font-family="sans-serif" font-size="14">• Fasting Blood Sugar (fbs)</text>
    <text x="30" y="410" fill="#cbd5e1" font-family="sans-serif" font-size="14">• Resting ECG Results (restecg)</text>
    <text x="30" y="445" fill="#cbd5e1" font-family="sans-serif" font-size="14">• Max Heart Rate Achieved (thalach)</text>
    <text x="30" y="480" fill="#cbd5e1" font-family="sans-serif" font-size="14">• Exercise-Induced Angina (exang)</text>
  </g>

  <!-- Right Visual / Decision Space -->
  <g transform="translate(500, 120)">
    <rect x="0" y="0" width="640" height="560" rx="12" fill="#1e1e38" stroke="#37375a"/>
    <text x="35" y="45" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">📊 Feature Correlation &amp; Prediction Evaluation</text>
    
    <!-- Pulse wave graphic -->
    <rect x="35" y="80" width="570" height="220" rx="8" fill="#111122" stroke="#2d2d48"/>
    <path d="M 50 190 L 150 190 L 175 140 L 200 240 L 225 110 L 250 210 L 275 190 L 375 190 L 400 130 L 425 240 L 450 100 L 475 220 L 500 190 L 580 190" fill="none" stroke="#f43f5e" stroke-width="3"/>
    <text x="50" y="120" fill="#f43f5e" font-family="sans-serif" font-size="14" font-weight="600">ELECTROCARDIOGRAM / THALACH CORRELATION</text>

    <!-- Prediction Outcome Card -->
    <rect x="35" y="330" width="570" height="190" rx="8" fill="#111122" stroke="#2d2d48"/>
    <text x="55" y="370" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600">PREDICTION OUTPUT SIMULATION</text>
    <rect x="55" y="400" width="230" height="80" rx="6" fill="#064e3b" stroke="#059669"/>
    <text x="75" y="435" fill="#6ee7b7" font-family="sans-serif" font-size="14" font-weight="600">Classification: Class 0</text>
    <text x="75" y="460" fill="#a7f3d0" font-family="sans-serif" font-size="12">Low Risk of Disease</text>

    <rect x="320" y="400" width="230" height="80" rx="6" fill="#450a0a" stroke="#dc2626"/>
    <text x="340" y="435" fill="#fca5a5" font-family="sans-serif" font-size="14" font-weight="600">Classification: Class 1</text>
    <text x="340" y="460" fill="#fecaca" font-family="sans-serif" font-size="12">High Likelihood / Referral</text>
  </g>
</svg>